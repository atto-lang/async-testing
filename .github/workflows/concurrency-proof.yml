name: concurrency-proof

on:
  push:
    branches:
      - main
      - 'proof/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-native-carrier-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [21, 25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Read upstream compiler pin
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          revision="$(cat compiler-revision.txt)"
          tree="$(cat compiler-tree.txt)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid compiler commit pin' >&2; exit 1; }
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid compiler tree pin' >&2; exit 1; }
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      # The exact historical compiler commit is available in the public Atto repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: atto-lang/atto-source.java
          ref: ${{ steps.compiler.outputs.revision }}
          path: .compiler
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Toolchain
        run: |
          java -version
          cc --version
          mvn -version

      - name: Compile and run concurrency proof suite
        run: ./scripts/test.sh

      - name: Repeat pending-operation and fanout proofs
        run: ./scripts/stress.sh 10

  persistent-actor-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read converged compiler pin
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          revision="$(cat compiler-revision.txt)"
          tree="$(cat compiler-tree.txt)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid compiler commit pin' >&2; exit 1; }
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid compiler tree pin' >&2; exit 1; }
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: atto-lang/atto-source.java
          ref: ${{ steps.compiler.outputs.revision }}
          path: .compiler
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 25
      - name: Verify exact converged actor compiler tree
        run: test "$(git -C .compiler rev-parse 'HEAD^{tree}')" = "$(cat compiler-tree.txt)"
      - name: Execute actor isolation and shared-code proofs
        run: |
          mvn -B -ntp -f .compiler/pom.xml \
            -Dtest=ActorDeclarationLexicalBoundaryTest,SourceActorSpawnExecutionTest,ActorMailTypeContractTest,ActorSharedCodeImageWhitelistTest,SourceActorCodeExecutorTest test
