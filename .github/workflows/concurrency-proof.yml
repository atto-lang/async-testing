name: concurrency-proof

on:
  push:
    branches:
      - main
      - 'proof/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-native-carrier-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [21, 25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read upstream compiler pin
        id: compiler
        run: echo "revision=$(cat compiler-revision.txt)" >> "$GITHUB_OUTPUT"

      # A source-only mirror lives in this repository. The default GITHUB_TOKEN
      # can read it; scripts/test.sh verifies its exact upstream source tree.
      - uses: actions/checkout@v4
        with:
          ref: compiler-mirror/${{ steps.compiler.outputs.revision }}
          path: .compiler
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Toolchain
        run: |
          java -version
          cc --version
          mvn -version

      - name: Compile and run concurrency proof suite
        run: ./scripts/test.sh
