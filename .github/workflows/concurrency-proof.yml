name: concurrency-proof

on:
  push:
    branches:
      - main
      - 'proof/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-native-carrier-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [21, 25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read upstream compiler pin
        id: compiler
        run: echo "revision=$(cat compiler-revision.txt)" >> "$GITHUB_OUTPUT"

      - name: Check private compiler access
        env:
          SOURCE_TOKEN: ${{ secrets.ORESLANG_SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "Configure ORESLANG_SOURCE_TOKEN with contents:read access to oreslang-source.java."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ores-truffle-oreslang/oreslang-source.java
          ref: ${{ steps.compiler.outputs.revision }}
          token: ${{ secrets.ORESLANG_SOURCE_TOKEN }}
          path: .compiler
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Toolchain
        run: |
          java -version
          cc --version
          mvn -version

      - name: Compile and run concurrency proof suite
        run: ./scripts/test.sh
