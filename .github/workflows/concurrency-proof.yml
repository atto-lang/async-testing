name: concurrency-proof

on:
  push:
    branches:
      - main
      - 'proof/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-native-carrier-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Toolchain
        run: |
          java -version
          cc --version
          mvn -version

      - name: Compile focused concurrency contract with Java carriers
        run: mvn -B -DskipTests -Dores.runtime.carriers=java test-compile

      - name: Run focused concurrency contract with Java carriers
        run: >
          mvn -B -DtrimStackTrace=false -Dores.runtime.carriers=java
          -Dtest=OresVMTest,OresSchedulerTest,ChannelRuntimeTest,ActorEventBusTest,ChannelSelectSyntaxTest,ConcurrencySyntaxContractTest,ConcurrencyContractProofTest,UntrustedActorTest
          test

      - name: Run full proof suite including native carrier coverage
        run: mvn -B -DtrimStackTrace=false test
